name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the site itself, not the README or workflow files.
      - name: Collect site files
        run: |
          mkdir _site
          cp -r *.html assets images .nojekyll _site/
          # Stamp each deploy's version on the CSS/JS links so browsers never use a stale copy.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/*.html

      # Photos can be uploaded straight from a camera or phone: the published copies
      # are resized to at most 2400px and compressed. The originals in the repo stay untouched.
      - name: Compress photos
        run: |
          command -v mogrify >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q imagemagick)
          find _site/images -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -exec \
            mogrify -auto-orient -resize '2400x2400>' -strip -interlace Plane -sampling-factor 4:2:0 -quality 82 {} +
          find _site/images -type f -iname '*.png' -exec mogrify -resize '2400x2400>' -strip {} +
          du -sh _site/images

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
